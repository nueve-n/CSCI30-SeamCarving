[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    m1: Milestone 1 -- energy
    m2: Milestone 2 -- find_vertical_seam
    m3: Milestone 3 -- find_horizontal_seam
    m4: Milestone 4 -- remove_vertical_seam
    m5: Milestone 5 -- remove_horizontal_seam
    uses(*methods): the test also calls these methods from other milestones
    time_limit(seconds): fail the test if it runs longer than this (default 10)
    weight(n): the test counts n times within its milestone when grading
